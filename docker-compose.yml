name: rag-embedding-search

# FR-DOC-01..05. Usage:
#   docker compose up -d           # database + API
#   docker compose run --rm ingest # one-shot ingestion (A-04)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      # FR-DOC-04: survives `down`, cleared by `down -v`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    depends_on:
      db:
        # FR-DOC-02: do not start serving before the database is reachable.
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set - copy .env.example to .env}
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

  # Profile-gated so `docker compose up` does not run it; invoked explicitly.
  ingest:
    build: .
    profiles: ["ingest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set - copy .env.example to .env}
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    volumes:
      # Read-only: ingestion never writes to the corpus.
      - ./corpus:/app/corpus:ro
    command: ["python", "ingest.py"]

  # The @unit acceptance suite (ADR-003). No database, no network, no API key needed.
  #   docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    environment:
      GEMINI_API_KEY: "test-key-not-real"
    volumes:
      # Mounted rather than baked in, so editing a spec or a step definition does not
      # require an image rebuild.
      - .:/app

  # The ui has its own dependency set (Streamlit needs a newer Starlette than FastAPI
  # allows), so its tests run in their own image.
  #   docker compose run --rm ui-tests
  ui-tests:
    build:
      context: .
      dockerfile: Dockerfile.ui-test
    profiles: ["test"]
    volumes:
      - .:/app

volumes:
  pgdata:
