[pytest]
testpaths = tests
pythonpath = .
bdd_features_base_dir = docs/spec/features
addopts = -q --strict-markers
markers =
    unit: no network or Docker required (the default suite)
    live: requires GEMINI_API_KEY and a real model
    docker: requires a running Docker daemon
    manual: human judgement; not automated
    ingestion: feature-level tag from ingestion.feature
    api: feature-level tag from query_api.feature
    grounding: feature-level tag from grounding_and_injection.feature
    runtime: feature-level tag from config_and_runtime.feature
